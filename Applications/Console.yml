authenticationSequence:
    attributeStepId: 1
    requestPathAuthenticators: []
    script: |-
        var onLoginRequest = function onLoginRequest(context) {

            var fedUser;
            executeStep(1, {
                onSuccess: function(context) {
                    var idpName = context.steps[1].idp;

                    // Only execute this flow when the user login from the central idp.
                    if (idpName === "Asgardeo Platform IDP") {
                        fedUser = context.currentKnownSubject;

                        // Check is there is already a user association
                        var assocUser = getAssociatedLocalUser(fedUser);
                        if (assocUser == null) {
                            var claimMap = {};
                            claimMap["http://wso2.org/claims/username"] = "PRIMARY/" + fedUser.remoteClaims.username;
                            // getUniqueUserWithClaimValues(<claims to match the user>, <tenant domain>)
                            var storedLocalUser = getUniqueUserWithClaimValues(claimMap, context);
                            if (storedLocalUser !== null) {
                                // Do the account linking
                                doAssociationWithLocalUser(fedUser, storedLocalUser.username, storedLocalUser.tenantDomain, storedLocalUser.userStoreDomain);
                            }
                        }
                    }
                }
            });
        };
    steps:
        - id: 1
          options:
            - authenticator: OpenIDConnectAuthenticator
              idp: Asgardeo Platform IDP
    subjectStepId: 1
    type: USER_DEFINED
claimConfiguration:
    claimMappings:
        - applicationClaim: http://wso2.org/claims/emailaddress
          localClaim:
            uri: http://wso2.org/claims/emailaddress
        - applicationClaim: http://wso2.org/claims/displayName
          localClaim:
            uri: http://wso2.org/claims/displayName
        - applicationClaim: http://wso2.org/claims/username
          localClaim:
            uri: http://wso2.org/claims/username
        - applicationClaim: http://wso2.org/claims/url
          localClaim:
            uri: http://wso2.org/claims/url
    dialect: LOCAL
    requestedClaims:
        - claim:
            uri: http://wso2.org/claims/emailaddress
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/displayName
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/username
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/url
          mandatory: false
    role:
        claim:
            uri: http://wso2.org/claims/role
        includeUserDomain: true
    subject:
        claim:
            uri: http://wso2.org/claims/userid
        includeTenantDomain: true
        includeUserDomain: true
        mappedLocalSubjectMandatory: false
        useMappedLocalSubject: true

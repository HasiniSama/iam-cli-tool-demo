accessUrl: https://myaccount.asgardeo.io/t/demodev/myaccount
advancedConfigurations:
    additionalSpProperties:
        - displayName: Is B2B Self Service Application
          name: isB2BSelfServiceApp
          value: "false"
        - displayName: Is System Reserved Application
          name: isSystemReservedApp
          value: "true"
    attestationMetaData:
        androidPackageName: ""
        appleAppId: ""
        enableClientAttestation: false
    discoverableByEndUsers: false
    enableAPIBasedAuthentication: false
    enableAuthorization: false
    fragment: false
    returnAuthenticatedIdpList: false
    saas: false
    skipLoginConsent: true
    skipLogoutConsent: true
    useExternalConsentPage: false
applicationEnabled: true
applicationVersion: v3.0.0
associatedRoles:
    allowedAudience: APPLICATION
    roles:
        - id: 2136f133-e748-4d62-8a7e-575a95c2a7dc
          name: Impersonator
authenticationSequence:
    attributeStepId: 1
    requestPathAuthenticators: []
    steps:
        - id: 1
          options:
            - authenticator: BasicAuthenticator
              idp: LOCAL
    subjectStepId: 1
    type: DEFAULT
claimConfiguration:
    claimMappings:
        - applicationClaim: http://wso2.org/claims/emailaddress
          localClaim:
            uri: http://wso2.org/claims/emailaddress
        - applicationClaim: http://wso2.org/claims/displayName
          localClaim:
            uri: http://wso2.org/claims/displayName
        - applicationClaim: http://wso2.org/claims/username
          localClaim:
            uri: http://wso2.org/claims/username
        - applicationClaim: http://wso2.org/claims/url
          localClaim:
            uri: http://wso2.org/claims/url
    dialect: LOCAL
    requestedClaims:
        - claim:
            uri: http://wso2.org/claims/emailaddress
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/displayName
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/username
          mandatory: false
        - claim:
            uri: http://wso2.org/claims/url
          mandatory: false
    role:
        claim:
            uri: http://wso2.org/claims/role
        includeUserDomain: true
    subject:
        claim:
            uri: http://wso2.org/claims/userid
        includeTenantDomain: true
        includeUserDomain: true
        mappedLocalSubjectMandatory: false
        useMappedLocalSubject: false
clientId: MY_ACCOUNT
description: This is the my account application.
enhancedOrgAuthenticationEnabled: false
id: 2924b1ad-8673-4c51-a604-290205cb2f5d
inboundProtocolConfiguration:
    oidc:
        _type: oidc
        accessToken:
            accessTokenAttributes: []
            applicationAccessTokenExpiryInSeconds: 3600
            bindingType: cookie
            revokeTokensWhenIDPSessionTerminated: true
            type: Default
            userAccessTokenExpiryInSeconds: 3600
            validateTokenBinding: true
        allowedOrigins: []
        callbackURLs:
            - regexp=(https://myaccount.asgardeo.io/t/(.*)/app|https://myaccount.asgardeo.io/t/(.*)/o/(.*)/app|https://console.asgardeo.io/app/resources/users/init-impersonate.html)
        cibaAuthenticationRequest:
            allowFederatedUsers: false
            authReqExpiryTime: 0
            notificationChannels: []
            skipUserValidation: false
        clientAuthentication: {}
        clientId: MY_ACCOUNT
        clientSecret: '********'
        grantTypes:
            - authorization_code
            - refresh_token
            - account_switch
            - urn:ietf:params:oauth:grant-type:token-exchange
        hybridFlow:
            enable: false
            responseType: "null"
        idToken:
            audience: []
            encryption:
                algorithm: ""
                enabled: false
                method: ""
            expiryInSeconds: 3600
        isFAPIApplication: false
        logout: {}
        pkce:
            mandatory: true
            supportPlainTransformAlgorithm: false
        publicClient: true
        pushAuthorizationRequest:
            requirePushAuthorizationRequest: false
        refreshToken:
            expiryInSeconds: 86400
            extendRenewedRefreshTokenExpiryTime: true
            gracefulRefreshTokenReuseLimit: 1
            gracefulRefreshTokenRotationEnabled: false
            gracefulRefreshTokenRotationValidityPeriod: 30
            renewRefreshToken: false
        requestObject:
            encryption:
                algorithm: ""
                method: ""
        scopeValidators: []
        state: ACTIVE
        subject:
            subjectType: public
        subjectToken:
            applicationSubjectTokenExpiryInSeconds: 180
            enable: true
        validateRequestObjectSignature: false
